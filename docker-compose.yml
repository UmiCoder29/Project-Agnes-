version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agnes-postgres
    environment:
      POSTGRES_USER: agnes
      POSTGRES_PASSWORD: agnes_dev_password
      POSTGRES_DB: agnes_db
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnes -d agnes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  agnes-core:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.core
    container_name: agnes-core
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://agnes:agnes_dev_password@postgres:5432/agnes_db"
      RUST_LOG: "info,agnes=debug"
      AGNES_SANDBOX_ROOTS: "/sandbox"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - test-filesystem:/sandbox

  local-http-server:
    image: python:3.11-alpine
    container_name: agnes-target-http
    command: python -m http.server 9000 --directory /srv
    ports:
      - "9000:9000"
    volumes:
      - ./infra/targets/http_srv:/srv:ro

  mock-agent:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.agent
    container_name: agnes-mock-agent
    environment:
      AGNES_GATEWAY_URL: "http://agnes-core:8080"
      AGENT_ID: "agent-001"
      RUST_LOG: "info"
    depends_on:
      - agnes-core

volumes:
  postgres-data:
  test-filesystem:
