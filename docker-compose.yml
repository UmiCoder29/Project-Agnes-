version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: blackwall-postgres
    environment:
      POSTGRES_USER: blackwall
      POSTGRES_PASSWORD: blackwall_dev_password
      POSTGRES_DB: blackwall_db
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackwall -d blackwall_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  blackwall-core:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.core
    container_name: blackwall-core
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://blackwall:blackwall_dev_password@postgres:5432/blackwall_db"
      RUST_LOG: "info,blackwall=debug"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - test-filesystem:/sandbox

  local-http-server:
    image: python:3.11-alpine
    container_name: blackwall-target-http
    command: python -m http.server 9000 --directory /srv
    ports:
      - "9000:9000"
    volumes:
      - ./infra/targets/http_srv:/srv:ro

  mock-agent:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.agent
    container_name: blackwall-mock-agent
    environment:
      BLACKWALL_GATEWAY_URL: "http://blackwall-core:8080"
      AGENT_ID: "agent-001"
      RUST_LOG: "info"
    depends_on:
      - blackwall-core

volumes:
  postgres-data:
  test-filesystem:
